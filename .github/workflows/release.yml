name: Release

# Push a tag such as v0.1.0 to build the portable Windows zip and publish it as a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # The portable zip bundles the embeddable distribution of this exact version.
      PYTHON_VERSION: "3.14.7"
      # From https://www.python.org/ftp/python/index-windows.json (pythoncore-3.14-64).
      PYTHON_SHA256: ac1a727a71738e11de80b76e975f9b8a258aea6412bfc31696b929d59c6aafd0
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Check the tag matches pyproject.toml
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match the project version $version"
          }

      - run: python -m pip install -e ".[dev]"
      - run: pytest -q

      # Both the runner's Python and the classic .exe installer ship unsigned Tcl/Tk DLLs,
      # which Smart App Control blocks. The Python Install Manager package signs them all.
      - name: Fetch the signed python.org package
        run: |
          $zip = "$env:RUNNER_TEMP\python.zip"
          Invoke-WebRequest "https://www.python.org/ftp/python/$env:PYTHON_VERSION/python-$env:PYTHON_VERSION-amd64.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:PYTHON_SHA256) { throw "Python package checksum mismatch" }
          Expand-Archive $zip "$env:RUNNER_TEMP\python"
          & "$env:RUNNER_TEMP\python\python.exe" --version

      - name: Build the portable zip
        run: '& "$env:RUNNER_TEMP\python\python.exe" scripts/build_portable.py'

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build the installer
        run: '& "$env:RUNNER_TEMP\python\python.exe" scripts/build_installer.py'

      - name: Install, start and uninstall FleetDesk
        run: ./scripts/smoke_test_installer.ps1

      - name: Prepare release assets
        shell: pwsh
        run: |
          # Fixed asset names keep releases/latest/download/<name> valid forever; the in-app
          # updater downloads the zip, the download page links the installer.
          Copy-Item dist/FleetDesk-*-windows.zip FleetDesk-windows.zip
          Copy-Item dist/FleetDesk-Setup.exe FleetDesk-Setup.exe
          $hashes = @{}
          foreach ($asset in "FleetDesk-Setup.exe", "FleetDesk-windows.zip") {
            $hashes[$asset] = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
            "$($hashes[$asset])  $asset" | Out-File -Encoding ascii "$asset.sha256"
          }
          $notes = @(
            "## Baixar",
            "",
            "- **FleetDesk-Setup.exe**: instalador (recomendado).",
            "- **FleetDesk-windows.zip**: versão portátil, para computadores em que o Windows bloqueia o instalador.",
            "",
            "Página de download: https://ziugod.github.io/fleetdesk/ · [Guia do usuário](https://github.com/ZIUGOD/fleetdesk/blob/main/docs/guia-do-usuario.md)",
            "",
            "Já usa o FleetDesk? Ele avisa a versão nova no topo da tela: clique em **Atualizar agora**.",
            "",
            "Windows 10 ou 11 (64 bits). Não precisa instalar Python nem ser administrador.",
            "",
            "SHA-256:",
            "- ``FleetDesk-Setup.exe``: ``$($hashes['FleetDesk-Setup.exe'])``",
            "- ``FleetDesk-windows.zip``: ``$($hashes['FleetDesk-windows.zip'])``"
          )
          $notes -join "`n" | Out-File -Encoding utf8 release-notes.md

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          FleetDesk-Setup.exe FleetDesk-Setup.exe.sha256
          FleetDesk-windows.zip FleetDesk-windows.zip.sha256
          --title "FleetDesk ${{ github.ref_name }}"
          --notes-file release-notes.md
